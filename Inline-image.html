<!DOCTYPE html>
<html>
    <head>
        <title>Image Tag Example</title>
    </head>
    <body>


        <div class="back">
             <a href="./Inline-Achor.html"> 
                <img src="./Images/backImage.jpg" height="50" width="50" />
             </a>
        </div>





         <!--
            src - File path
                => Absolute path [entire path - 
                file:///C:/Developement/HTML%20CSS%20LEARNINGS/Html-Mourain/Images/ajith1.jpg]

                => Relative path [specifed path - ./Images/ajith1.jpg]


            height - horizontal view point
            width - vertical size view
          -->

        

        <img 
            src="./Images/ajith1.jpg" 
            height="100"
            width="100"
            id="profile-pic"
            class="cprofile-pic"
        />
        
        <img 
            src="https://wallpapercave.com/wp/wp7603632.jpg" 
            height="100"
            width="100"
            id="profile-pic"
            class="cprofile-pic"
        />





    </body>
</html>
