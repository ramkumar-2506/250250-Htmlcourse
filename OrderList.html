<!DOCTYPE html>
<html>
    <head>
        <title>Order Listing Example</title>
    </head>
    <body>
        <div class="orderList">
            <h1> Fruits - Order orderList </h1>

            <!--Order list type attribute values
            
                type="1"	This will list the items with numbers (default)
                type="A"	This will list the items in uppercase letters.
                type="a"	This will list the items in lowercase letters.
                type="I"	This will list the items with uppercase Roman numbers.
                type="i"    This will list the items with lowercase Roman numbers.
            
            
            -->




            <ol>
                <li value="apple"> Apple </li>
                <li value="orange"> Orange </li>
                <li value="grapes"> Grapes </li>
                <li value="pineapple"> Pine apple </li>
            </ol>

             <ol type="A">
                <li value="apple"> Apple </li>
                <li value="orange"> Orange </li>
                <li value="grapes"> Grapes </li>
                <li value="pineapple"> Pine apple </li>
            </ol>

             <ol type="a">
                <li value="apple"> Apple </li>
                <li value="orange"> Orange </li>
                <li value="grapes"> Grapes </li>
                <li value="pineapple"> Pine apple </li>
            </ol>

            <ol type="I">
                <li value="apple"> Apple </li>
                <li value="orange"> Orange </li>
                <li value="grapes"> Grapes </li>
                <li value="pineapple"> Pine apple </li>
            </ol>

             <ol type="i">
                <li value="apple"> Apple </li>
                <li value="orange"> Orange </li>
                <li value="grapes"> Grapes </li>
                <li value="pineapple"> Pine apple </li>
            </ol>

    </body>
